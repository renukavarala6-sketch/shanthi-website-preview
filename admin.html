
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Product Management</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #e8f1ff;
  margin: 0;
  padding: 25px;
}

.box {
  max-width: 650px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 4px 15px #0002;
}

h2 {
  color: #10233f;
  text-align: center;
}

input, textarea, button {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin: 8px 0;
  font-family: Arial, sans-serif;
}

input, textarea {
  border: 1px solid #ccd8e8;
  border-radius: 5px;
}

button {
  background: #10233f;
  color: white;
  border: 0;
  border-radius: 5px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

#dashboard {
  display: none;
}

#message {
  overflow-wrap: anywhere;
}

.gallery {
  margin: 15px 0;
  text-align: center;
}

#preview {
  display: none;
  width: 100%;
  max-height: 250px;
  object-fit: contain;
  margin: 10px auto;
}

.gallery-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

.gallery-controls button {
  width: 55px;
  flex-shrink: 0;
  font-size: 20px;
}

#imageCounter {
  flex: 1;
  text-align: center;
  color: #10233f;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

.hint {
  font-size: 13px;
  color: #555;
  margin: 4px 0 10px;
}

#productList {
  margin-top: 25px;
}

.product-item {
  border: 1px solid #ccd8e8;
  border-radius: 8px;
  padding: 15px;
  margin: 15px 0;
}

.product-item img {
  width: 100%;
  height: 150px;
  object-fit: contain;
  background: #f5f7fa;
  border-radius: 5px;
}

.product-item h3 {
  color: #10233f;
  overflow-wrap: anywhere;
}

.product-item p {
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  line-height: 1.5;
}

.product-actions {
  display: flex;
  gap: 10px;
}

.product-actions button {
  flex: 1;
}

.delete-btn {
  background: #b42318;
}

.cancel-btn {
  background: #666;
}

#formHeading {
  margin-top: 20px;
}

#cancelEditBtn {
  display: none;
}

label {
  display: block;
  color: #10233f;
  font-weight: bold;
  margin-top: 12px;
}
</style>
</head>

<body>

<div class="box">

  <h2>Admin Login</h2>

  <input id="email" type="email" placeholder="Admin Email" required>
  <input id="password" type="password" placeholder="Password" required>

  <button id="loginBtn" type="button">Login</button>

  <p id="message" role="status"></p>

  <div id="dashboard">

    <h2 id="formHeading">Add New Product</h2>

    <form id="productForm">

      <label>Product Name</label>
      <input
        id="name"
        type="text"
        placeholder="Enter Product Name"
        required
      >

      <label>Main Product Image</label>
      <input
        id="image"
        type="url"
        placeholder="Paste Main Image URL"
        required
      >

      <label>Extra Product Images</label>
      <textarea
        id="extraImages"
        placeholder="Paste extra image URLs here. One URL per line."
      ></textarea>

      <p class="hint">
        Main image and extra images preview will appear below.
      </p>

      <div class="gallery">

        <img id="preview" alt="Product image preview">

        <div class="gallery-controls">
          <button type="button" id="prevBtn">❮</button>
          <span id="imageCounter">0 / 0</span>
          <button type="button" id="nextBtn">❯</button>
        </div>

      </div>

      <label>Model Number</label>
      <input
        id="model"
        type="text"
        placeholder="Enter Model Number"
      >

      <label>Product Description</label>
      <textarea
        id="description"
        placeholder="Enter Product Description"
        required
      ></textarea>

      <label>Product Specifications</label>
      <textarea
        id="specifications"
        placeholder="Enter Product Specifications. One specification per line."
      ></textarea>

      <button id="addBtn" type="submit">Add Product</button>

      <button
        id="cancelEditBtn"
        class="cancel-btn"
        type="button"
      >
        Cancel Edit
      </button>

    </form>

    <div id="productList">

      <h2>Manage Products</h2>

      <button id="refreshBtn" type="button">
        Refresh Products
      </button>

      <div id="productsContainer"></div>

    </div>

    <button id="logoutBtn" type="button">Logout</button>

  </div>

</div>

<script type="module">

// Import Firebase App
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

// Import Firebase Authentication
import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// Import Firestore functions
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  updateDoc,
  deleteDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// Firebase connection settings
const firebaseConfig = {
apiKey: "AIzaSyADHkR1H2zyHUp5SBDWbpMKJpCtsZFNneo",
  authDomain: "shanthi-engineering-works.firebaseapp.com",
  projectId: "shanthi-engineering-works",
  storageBucket: "shanthi-engineering-works.firebasestorage.app",
  messagingSenderId: "619909039011",
  appId: "1:619909039011:web:a561d677705bedefb4d016",
  measurementId: "G-GDQ266ET18"
};


// Start Firebase
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


// Admin email
const adminEmail = "renukavarala6@gmail.com";


// Get HTML elements
const message = document.getElementById("message");
const dashboard = document.getElementById("dashboard");
const loginBtn = document.getElementById("loginBtn");
const productForm = document.getElementById("productForm");
const addBtn = document.getElementById("addBtn");

const imageInput = document.getElementById("image");
const extraImagesInput = document.getElementById("extraImages");

const modelInput = document.getElementById("model");
const descriptionInput = document.getElementById("description");
const specificationsInput = document.getElementById("specifications");

const preview = document.getElementById("preview");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const imageCounter = document.getElementById("imageCounter");

const productsContainer = document.getElementById("productsContainer");
const formHeading = document.getElementById("formHeading");
const cancelEditBtn = document.getElementById("cancelEditBtn");


// Gallery variables
let galleryImages = [];
let currentImageIndex = 0;
let editingProductId = null;


// Check whether current user is admin
function isAdminUser() {

  const user = auth.currentUser;

  return user &&
    user.email?.toLowerCase() === adminEmail.toLowerCase();

}


// Show or hide Admin Dashboard
function showAdmin(user) {

  const isAdmin =
    user && user.email?.toLowerCase() === adminEmail.toLowerCase();

  dashboard.style.display = isAdmin ? "block" : "none";
  loginBtn.style.display = isAdmin ? "none" : "block";

  document.getElementById("email").style.display =
    isAdmin ? "none" : "block";

  document.getElementById("password").style.display =
    isAdmin ? "none" : "block";

}


// Update gallery preview
function updateGallery() {

  const mainImage = imageInput.value.trim();

  const extraImages = extraImagesInput.value
    .split("\n")
    .map(url => url.trim())
    .filter(url => url.startsWith("https://"));

  galleryImages = [];

  if (mainImage.startsWith("https://")) {
    galleryImages.push(mainImage);
  }

  galleryImages.push(...extraImages);

  galleryImages = [...new Set(galleryImages)];

  currentImageIndex = 0;

  showGalleryImage();

}


// Display one image at a time
function showGalleryImage() {

  if (galleryImages.length === 0) {

    preview.removeAttribute("src");
    preview.style.display = "none";
    imageCounter.textContent = "0 / 0";

    return;

  }

  preview.style.display = "block";
  preview.src = galleryImages[currentImageIndex];

  imageCounter.textContent =
    `${currentImageIndex + 1} / ${galleryImages.length}`;

}


// Previous image
prevBtn.onclick = () => {

  if (galleryImages.length === 0) return;

  currentImageIndex--;

  if (currentImageIndex < 0) {
    currentImageIndex = galleryImages.length - 1;
  }

  showGalleryImage();

};


// Next image
nextBtn.onclick = () => {

  if (galleryImages.length === 0) return;

  currentImageIndex++;

  if (currentImageIndex >= galleryImages.length) {
    currentImageIndex = 0;
  }

  showGalleryImage();

};


// Update preview when image URLs change
imageInput.addEventListener("input", updateGallery);
extraImagesInput.addEventListener("input", updateGallery);


// Handle image loading errors
preview.onerror = () => {

  preview.style.display = "none";

  message.textContent =
    "Image URL open avvatledu. Correct image URL use cheyyi.";

};


// Reset product form
function resetProductForm() {

  productForm.reset();

  editingProductId = null;

  formHeading.textContent = "Add New Product";
  addBtn.textContent = "Add Product";

  cancelEditBtn.style.display = "none";

  galleryImages = [];
  currentImageIndex = 0;

  showGalleryImage();

}


// Load all products from Firestore
async function loadProducts() {

  if (!isAdminUser()) return;

  productsContainer.textContent = "Loading products...";

  try {

    const snapshot = await getDocs(collection(db, "products"));

    productsContainer.replaceChildren();

    if (snapshot.empty) {

      productsContainer.textContent = "No products found.";

      return;

    }

    snapshot.forEach((productDoc) => {

      const product = productDoc.data();

      const item = document.createElement("div");
      item.className = "product-item";

      const image = document.createElement("img");
      image.alt = product.name || "Product image";

      if (typeof product.image === "string") {
        image.src = product.image;
      }

      const title = document.createElement("h3");
      title.textContent = product.name || "Unnamed Product";

      const modelText = document.createElement("p");
      modelText.textContent =
        "Model Number: " + (product.model || "Not specified");

      const description = document.createElement("p");
      description.textContent =
        "Description: " +
        (product.description || "No description available.");

      const specificationsText = document.createElement("p");
      specificationsText.textContent =
        "Specifications: " +
        (product.specifications || "Not specified");

      const extraCount = Array.isArray(product.extraImages)
        ? product.extraImages.length
        : 0;

      const imageCount = document.createElement("p");
      imageCount.textContent = `Extra images: ${extraCount}`;

      const actions = document.createElement("div");
      actions.className = "product-actions";

      const editButton = document.createElement("button");
      editButton.textContent = "Edit";

      editButton.onclick = () => {
        editProduct(productDoc.id, product);
      };

      const deleteButton = document.createElement("button");
      deleteButton.textContent = "Delete";
      deleteButton.className = "delete-btn";

      deleteButton.onclick = () => {
        deleteProduct(productDoc.id, product.name);
      };

      actions.append(editButton, deleteButton);

      item.append(
        image,
        title,
        modelText,
        description,
        specificationsText,
        imageCount,
        actions
      );

      productsContainer.appendChild(item);

    });

  } catch (error) {

    console.error(error);

    productsContainer.textContent =
      "Unable to load products. Check Firestore settings.";

  }

}


// Load selected product into the form
function editProduct(productId, product) {

  if (!isAdminUser()) return;

  editingProductId = productId;

  document.getElementById("name").value =
    product.name || "";

  imageInput.value =
    product.image || "";

  extraImagesInput.value =
    Array.isArray(product.extraImages)
      ? product.extraImages.join("\n")
      : "";

  modelInput.value =
    product.model || "";

  descriptionInput.value =
    product.description || "";

  specificationsInput.value =
    product.specifications || "";

  formHeading.textContent = "Edit Product";
  addBtn.textContent = "Update Product";

  cancelEditBtn.style.display = "block";

  updateGallery();

  message.textContent =
    "Product loaded. Make changes and click Update Product.";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


// Delete selected product
async function deleteProduct(productId, productName) {

  if (!isAdminUser()) {

    message.textContent = "Please login as admin first.";

    return;

  }

  const confirmed = window.confirm(
    `Are you sure you want to delete "${productName || "this product"}"?`
  );

  if (!confirmed) return;

  message.textContent = "Deleting product...";

  try {

    await deleteDoc(doc(db, "products", productId));

    if (editingProductId === productId) {
      resetProductForm();
    }

    message.textContent = "Product deleted successfully!";

    await loadProducts();

  } catch (error) {

    console.error(error);

    message.textContent =
      "Delete failed. Check Firestore security rules.";

  }

}


// Check login status
onAuthStateChanged(auth, async (user) => {

  showAdmin(user);

  if (user && user.email?.toLowerCase() === adminEmail.toLowerCase()) {

    message.textContent = "Admin logged in.";

    await loadProducts();

  } else {

    productsContainer.replaceChildren();

  }

});


// Admin login
loginBtn.onclick = async () => {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {

    message.textContent = "Enter email and password.";

    return;

  }

  loginBtn.disabled = true;

  try {

    const result = await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    if (result.user.email?.toLowerCase() !== adminEmail.toLowerCase()) {

      await signOut(auth);

      throw new Error("Admin access denied.");

    }

    showAdmin(result.user);

    message.textContent = "Login successful.";

    await loadProducts();
} catch (error) {

    console.error("Firebase Login Error:", error);

    message.textContent =
      "Login Error: " + error.code + " - " + error.message;

  } finally {

    loginBtn.disabled = false;

  }

};


// Add or update product
productForm.onsubmit = async (event) => {

  event.preventDefault();

  if (!isAdminUser()) {

    message.textContent = "Please login as admin first.";

    return;

  }

  const name = document.getElementById("name").value.trim();

  const model = modelInput.value.trim();

  const description = descriptionInput.value.trim();

  const specifications = specificationsInput.value.trim();

  const imageURL = imageInput.value.trim();

  const extraImages = extraImagesInput.value
    .split("\n")
    .map(url => url.trim())
    .filter(url => url !== "");


  // Check required product details
  if (!name || !description || !imageURL.startsWith("https://")) {

    message.textContent =
      "Enter product name, description and HTTPS main image URL.";

    return;

  }


  // Check extra image URLs
  if (extraImages.some(url => !url.startsWith("https://"))) {

    message.textContent =
      "All extra image URLs must start with https://";

    return;

  }


  // Remove duplicate images and main image from extras
  const uniqueExtraImages = [
    ...new Set(extraImages.filter(url => url !== imageURL))
  ];


  addBtn.disabled = true;

  message.textContent = editingProductId
    ? "Updating product..."
    : "Saving product...";


  try {

    const productData = {

      name: name,

      image: imageURL,

      extraImages: uniqueExtraImages,

      model: model,

      description: description,

      specifications: specifications

    };


    if (editingProductId) {

      // Update existing product
      await updateDoc(
        doc(db, "products", editingProductId),
        {
          ...productData,
          updatedAt: serverTimestamp()
        }
      );

      message.textContent = "Product updated successfully!";

    } else {

      // Add new product
      await addDoc(collection(db, "products"), {

        ...productData,

        createdAt: serverTimestamp()

      });

      message.textContent =
        "Product added to Firestore successfully!";

    }


    resetProductForm();

    await loadProducts();

  } catch (error) {

    console.error("Firebase Login Error:", error);

    message.textContent =
      "Login Error: " + error.code + " - " + error.message;

  } finally {

    addBtn.disabled = false;

  }

};


// Cancel edit
cancelEditBtn.onclick = () => {

  resetProductForm();

  message.textContent = "Edit cancelled.";

};


// Refresh product list
document.getElementById("refreshBtn").onclick = loadProducts;


// Admin logout
document.getElementById("logoutBtn").onclick = async () => {

  try {

    await signOut(auth);

    resetProductForm();

    dashboard.style.display = "none";

    loginBtn.style.display = "block";

    document.getElementById("email").style.display = "block";

    document.getElementById("password").style.display = "block";

    productsContainer.replaceChildren();

    message.textContent = "Logged out.";

  } catch (error) {

    message.textContent = "Logout failed. Please try again.";

  }

};

</script>

</body>
</html>
